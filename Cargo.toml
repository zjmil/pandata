[package]
name = "pandata"
description = "A CLI tool for converting data"
version = "0.1.0"
authors = ["Zach Miller <zach@zjmil.org>"]
repository = "https://github.com/zjmil/pandata"
license = "MIT"
readme = "README.md"
keywords = ["data", "cli", "conversion", "formats"]
categories = ["command-line-utilities", "data-structures", "parsing"]
edition = "2021"
rust-version = "1.99.1"

[dependencies]
anyhow = "1.0.93"
bytes = "1.9.0"
clap = { version = "4.5.21", features = ["derive"] }
polars = { version = "0.55.0", features = ["lazy", "streaming", "ipc"] }
polars-plan = "0.55.0"
rusqlite = { version = "0.40.1", optional = true, features = ["bundled", "column_decltype"] }

[features]
default = ["all"]
csv = ["polars/csv"]
json = ["polars/json"]
parquet = ["polars/parquet"]
tsv = ["csv"]
avro = ["polars/avro"]
ipc = ["polars/ipc"]
ndjson = ["polars/json"]
sqlite = ["dep:rusqlite"]
all = ["csv", "json", "parquet", "tsv", "avro", "ipc", "ndjson", "sqlite"]

[[bench]]
name = "conversions"
harness = false
test = false
required-features = ["csv", "json", "parquet"]
