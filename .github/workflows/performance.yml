name: Conversion performance
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: performance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare revisions
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/performance-gate.sh "$BASE" "$HEAD"
      - name: Retain measurements and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversion-performance
          path: performance-results/
          if-no-files-found: warn
