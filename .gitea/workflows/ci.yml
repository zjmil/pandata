name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Set up Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: https://github.com/Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked
